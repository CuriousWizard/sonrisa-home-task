<header class="border-b">
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-8 gap-y-2 px-6 py-3"
  >
    <span class="font-semibold">Alerts</span>
    <nav
      aria-label="Main"
      class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm"
    >
      @for (link of userLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="text-primary font-medium"
        ariaCurrentWhenActive="page"
        class="text-muted-foreground hover:text-foreground"
        >{{ link.label }}</a
      >
      } @if (auth.isAdmin()) { @for (link of adminLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="text-primary font-medium"
        ariaCurrentWhenActive="page"
        class="text-muted-foreground hover:text-foreground"
        >{{ link.label }}</a
      >
      } }
    </nav>
    <div class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
      <span class="text-muted-foreground break-all"
        >{{ auth.user()?.email }}</span
      >
      @if (signOutError(); as message) {
      <span role="alert" class="text-destructive">{{ message }}</span>
      }
      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        (click)="signOut()"
      >
        Sign out
      </button>
    </div>
  </div>
</header>
<main class="mx-auto max-w-6xl px-6 py-8">
  <router-outlet />
</main>
