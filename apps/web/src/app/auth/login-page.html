<main class="mx-auto max-w-6xl px-6 py-12">
  <p class="mb-6 font-semibold">Alerts</p>
  <section hlmCard class="max-w-sm">
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-xl font-semibold">Sign in</h1>
      <p hlmCardDescription>Use the email and password of your account.</p>
    </div>
    <div hlmCardContent>
      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="flex flex-col gap-4"
      >
        <div class="flex flex-col gap-2">
          <label hlmLabel for="email">Email</label>
          <input
            hlmInput
            id="email"
            type="email"
            autocomplete="email"
            formControlName="email"
            [forceInvalid]="!!errors().email"
            [aria-describedby]="errors().email ? 'email-error' : null"
          />
          @if (errors().email; as message) {
          <p id="email-error" class="text-destructive text-sm">{{ message }}</p>
          }
        </div>
        <div class="flex flex-col gap-2">
          <label hlmLabel for="password">Password</label>
          <input
            hlmInput
            id="password"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            [forceInvalid]="!!errors().password"
            [aria-describedby]="errors().password ? 'password-error' : null"
          />
          @if (errors().password; as message) {
          <p id="password-error" class="text-destructive text-sm">
            {{ message }}
          </p>
          }
        </div>
        <button hlmBtn type="submit" class="self-start" [disabled]="pending()">
          Sign in
        </button>
      </form>
      @if (serverError(); as message) {
      <div hlmAlert variant="destructive" class="mt-4">
        <p hlmAlertDescription>{{ message }}</p>
      </div>
      }
    </div>
    <div hlmCardFooter>
      <p class="text-muted-foreground text-sm">
        No account yet?
        <a
          routerLink="/register"
          class="text-primary font-medium underline-offset-4 hover:underline"
          >Create an account</a
        >
      </p>
    </div>
  </section>
</main>
